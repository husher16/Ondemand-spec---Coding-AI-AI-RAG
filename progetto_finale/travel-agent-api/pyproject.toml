[project]
name = "travel-agent-api"
version = "0.1.0"
description = "AI Travel Agent API built with FastAPI, LangChain, and LangGraph"
authors = [
    {name = "Danut Frunza", email = "husher16@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "openai>=1.20.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.1.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "google-search-results>=2.4.2",
    "httpx>=0.27.0",
    "pytest>=8.0.0"
]

[tool.poetry]
packages = [{include = "travel_agent_api"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
